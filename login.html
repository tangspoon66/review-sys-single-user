<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>深圳科学技术馆推介官 - 登录</title>
    <style>
      :root {
        color: #eaf3ff;
        background: #07101d;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 15% 10%, rgba(70,166,255,.24), transparent 28%),
          radial-gradient(circle at 86% 18%, rgba(123,109,255,.20), transparent 24%),
          linear-gradient(180deg, #0a1424, #050a12);
      }
      .login-card {
        width: min(420px, 100%);
        padding: 26px;
        border: 1px solid rgba(200,230,255,.16);
        border-radius: 16px;
        background: rgba(10,18,33,.78);
        box-shadow: 0 24px 56px rgba(0,0,0,.28);
      }
      h1 { margin: 0 0 6px; font-size: 22px; line-height: 1.25; }
      .muted { margin: 0 0 22px; color: #9eb4d1; font-size: 13px; line-height: 1.55; }
      form { display: grid; gap: 14px; }
      label { display: grid; gap: 7px; color: #cfe2ff; font-size: 13px; font-weight: 700; }
      input {
        width: 100%;
        min-height: 46px;
        border: 1px solid rgba(200,230,255,.18);
        border-radius: 12px;
        background: rgba(255,255,255,.06);
        color: #fff;
        padding: 0 13px;
        outline: none;
        font: inherit;
      }
      input:focus { border-color: rgba(70,166,255,.78); box-shadow: 0 0 0 3px rgba(70,166,255,.16); }
      button {
        min-height: 48px;
        border: 0;
        border-radius: 12px;
        color: #fff;
        background: linear-gradient(135deg, #46a6ff, #7b6dff);
        font: inherit;
        font-weight: 850;
      }
      .message { min-height: 20px; color: #ff93a7; font-size: 13px; font-weight: 700; }
    </style>
  </head>
  <body>
    <main class="login-card">
      <h1>深圳科学技术馆推介官后台</h1>
      <p class="muted">请输入后台账号密码。</p>
      <form id="loginForm">
        <label>
          账号
          <input id="username" name="username" autocomplete="username" required />
        </label>
        <label>
          密码
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </label>
        <button type="submit">登录后台</button>
        <div class="message" id="message"></div>
      </form>
    </main>
    <script>
      const form = document.querySelector("#loginForm");
      const message = document.querySelector("#message");

      async function checkSession() {
        const response = await fetch("/api/auth/session");
        const data = await response.json();
        if (data.authenticated) location.replace("/admin.html");
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        message.textContent = "";
        const username = document.querySelector("#username").value.trim();
        const password = document.querySelector("#password").value;

        try {
          const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });
          const data = await response.json();
          if (!data.ok) throw new Error(data.message || "登录失败");
          location.replace("/admin.html");
        } catch (error) {
          message.textContent = error.message;
        }
      });

      checkSession().catch(() => {});
    </script>
  </body>
</html>
